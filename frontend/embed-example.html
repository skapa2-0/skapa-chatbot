<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exemple d'intégration - site client</title>
  </head>
  <body>
    <h1>Bienvenue sur le site client</h1>
    <p>Le chatbot ci-dessous est ajouté en une seule ligne, sans rien installer.</p>

    <!--
      Une fois `npm run build` exécuté, servez dist/skapa-widget.js
      (ex: copiez-le sur votre CDN / serveur statique) et ajoutez ce script
      sur n'importe quelle page du site :
    -->
    <script
      src="https://votre-domaine.com/skapa-widget.js"
      data-api-url="https://votre-api.com/api"
      data-site-id="site-client-1"
      data-title="Besoin d'aide ?"
      data-color="#4f46e5"
    ></script>
  </body>
</html>
