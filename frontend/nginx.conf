server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    location = /documentation.html {
        return 301 /documentation;
    }

    location = /documentation {
        alias /usr/share/nginx/html/documentation.html;
        default_type text/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
