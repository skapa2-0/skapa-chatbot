server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css;
    gzip_min_length 1024;

    location = /skapa-widget.js {
        # Chargé par une balise <script src> depuis les sites clients : ce cas
        # n'a pas besoin de CORS, mais l'en-tête permet aussi un chargement
        # dynamique (fetch/import) par un client qui le préférerait.
        add_header Access-Control-Allow-Origin "*";

        # 5 min : un nouveau build se propage vite chez tous les clients.
        # Pour du cache long, déployer un nom versionné (skapa-widget.v2.js)
        # et passer à "public, max-age=31536000, immutable".
        add_header Cache-Control "public, max-age=300";

        try_files $uri =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Rien d'autre n'est servi : ce conteneur ne publie que le widget.
    location / {
        return 404;
    }
}
